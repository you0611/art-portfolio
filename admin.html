<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网站管理 · 游祥龙艺术工作室</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="游祥龙艺术工作室管理后台 — 作品管理、艺术家资料、人员与咨询记录维护。"
    />
    <link rel="stylesheet" href="styles.css?v=20260810-redesign" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="gallery.html" aria-label="游祥龙艺术工作室">
        <span class="brand-mark">YX</span>
        <span>
          <strong data-i18n="brandName">游祥龙艺术工作室</strong>
          <small data-i18n="brandSub">油画 · 风景 · 人物</small>
        </span>
      </a>
      <nav class="main-nav" id="main-navigation" aria-label="Admin navigation">
        <a href="gallery.html#gallery" data-i18n="navGallery">作品</a>
        <a href="gallery.html#artist" data-i18n="navArtist">艺术家</a>
        <a href="gallery.html#contact" data-i18n="navContact">收藏咨询</a>
      </nav>
      <div class="header-actions">
        <button class="ghost-button" id="languageToggle" type="button">EN</button>
        <button class="menu-button" id="menuToggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="main-navigation"><span aria-hidden="true"></span></button>
      </div>
    </header>

    <main>
      <section class="section admin-section" id="admin">
        <div class="section-heading">
          <p data-i18n="adminKicker">Management</p>
          <h2 data-i18n="adminTitle">网站管理</h2>
          <p class="form-note" id="adminStatus" aria-live="polite"></p>
          <button class="secondary-button" id="reloadWorks" type="button" data-i18n="reloadWorks">重新加载作品</button>
        </div>

        <div class="admin-tabs">
          <button class="tab is-active" data-admin-tab="works" data-i18n="tabWorks" type="button">作品管理</button>
          <button class="tab" data-admin-tab="artist" data-i18n="tabArtist" type="button">艺术家资料</button>
          <button class="tab" data-admin-tab="people" data-i18n="tabPeople" type="button">人员</button>
          <button class="tab" data-admin-tab="orders" data-i18n="tabOrders" type="button">商务咨询</button>
          <button class="tab" data-admin-tab="inquiries" data-i18n="tabInquiries" type="button">咨询记录</button>
        </div>

        <!-- 作品管理 -->
        <div class="admin-panel" id="adminWorks">
          <form class="admin-form" id="workForm">
            <input id="workId" type="hidden" />
            <input id="workVersion" type="hidden" />
            <input id="workDisplayOrder" type="hidden" />
            <div class="form-grid">
              <label>
                <span data-i18n="titleZh">中文标题</span>
                <input id="titleZh" />
              </label>
              <label>
                <span data-i18n="titleEn">英文标题</span>
                <input id="titleEn" />
              </label>
              <label>
                <span data-i18n="category">系列/类别</span>
                <input id="category" />
              </label>
              <label>
                <span data-i18n="medium">媒介</span>
                <input id="medium" />
              </label>
              <label>
                <span data-i18n="size">尺寸</span>
                <input id="size" />
              </label>
              <label>
                <span data-i18n="year">年份</span>
                <input id="year" type="number" min="1900" max="2200" step="1" />
              </label>
              <label>
                <span data-i18n="price">价格</span>
                <input id="price" type="number" min="0" step="1" />
              </label>
              <label>
                <span data-i18n="currency">币种</span>
                <input id="currency" maxlength="3" value="CNY" />
              </label>
              <label>
                <span data-i18n="status">销售状态</span>
                <select id="status"></select>
              </label>
              <label>
                <span data-i18n="contentStatus">展示状态</span>
                <select id="contentStatus"></select>
              </label>
            </div>
            <label class="checkbox-line">
              <input id="hidePrice" type="checkbox" />
              <span data-i18n="hidePrice">不公开价格</span>
            </label>
            <label class="checkbox-line">
              <input id="negotiationEnabled" type="checkbox" checked />
              <span data-i18n="negotiationEnabled">启用议价</span>
            </label>
            <label>
              <span data-i18n="imagePath">图片路径</span>
              <input id="image" placeholder="/assets/example.jpg" />
            </label>
            <label>
              <span data-i18n="descriptionZh">中文简介</span>
              <textarea id="descriptionZh" rows="3"></textarea>
            </label>
            <label>
              <span data-i18n="descriptionEn">英文简介</span>
              <textarea id="descriptionEn" rows="3"></textarea>
            </label>
            <div class="form-actions">
              <button class="primary-button" type="submit" data-i18n="saveWork">保存作品</button>
              <button class="secondary-button" type="button" id="resetWorkForm" data-i18n="newWork">新增作品</button>
            </div>
          </form>
          <div class="admin-list" id="workAdminList"></div>
        </div>

        <!-- 服务端商务咨询与议价 -->
        <div class="admin-panel admin-orders-panel" id="adminOrders" hidden>
          <div>
            <p class="form-note" data-i18n="adminOrdersNotice">这里是服务端咨询与议价流程；旧浏览器里的咨询记录不会自动迁移。</p>
            <div class="admin-order-filters">
              <label>
                <span data-i18n="followUpFilter">跟进筛选</span>
                <select id="orderFollowUpFilter">
                  <option value="all" data-i18n="allFollowUps">全部跟进</option>
                  <option value="unprocessed" data-i18n="unprocessed">未处理</option>
                  <option value="contacting" data-i18n="contacting">沟通中</option>
                  <option value="completed" data-i18n="completed">已完成</option>
                  <option value="cancelled" data-i18n="cancelled">已取消</option>
                </select>
              </label>
              <label>
                <span data-i18n="orderSort">排序</span>
                <select id="orderSort">
                  <option value="followUp" data-i18n="sortFollowUp">按跟进时间</option>
                  <option value="updated" data-i18n="sortUpdated">按最近更新</option>
                  <option value="created" data-i18n="sortCreated">按创建时间</option>
                </select>
              </label>
              <button class="secondary-button" id="reloadOrders" type="button" data-i18n="reloadOrders">重新加载咨询</button>
            </div>
            <div class="admin-list" id="orderAdminList"></div>
          </div>
          <div class="admin-order-tools">
            <p class="form-note" id="selectedOrderSummary" data-i18n="selectOrder">请选择一条咨询</p>
            <form class="admin-form" id="offerForm" hidden>
              <label>
                <span data-i18n="offerAmount">报价金额（分）</span>
                <input id="orderOfferAmount" type="number" min="0" step="1" required />
              </label>
              <label>
                <span data-i18n="currency">币种</span>
                <input id="orderOfferCurrency" maxlength="3" value="CNY" required />
              </label>
              <label>
                <span data-i18n="offerMessage">报价说明</span>
                <textarea id="orderOfferMessage" rows="3"></textarea>
              </label>
              <button class="primary-button" type="submit" data-i18n="sendOffer">发送报价</button>
            </form>
            <form class="admin-form" id="holdForm" hidden>
              <label>
                <span data-i18n="holdOffer">接受哪一份报价</span>
                <select id="holdOffer" required></select>
              </label>
              <label>
                <span data-i18n="holdDuration">占用时长（分钟）</span>
                <input id="holdDuration" type="number" min="5" max="43200" step="5" value="1440" required />
              </label>
              <div class="form-actions">
                <button class="primary-button" id="createHold" type="submit" data-i18n="createHold">接受报价并占用作品</button>
                <button class="secondary-button" id="releaseHold" type="button" data-i18n="releaseHold">释放作品占用</button>
              </div>
            </form>
            <form class="admin-form" id="orderStatusForm" hidden>
              <label>
                <span data-i18n="orderStatus">订单阶段</span>
                <select id="orderStatus">
                  <option value="negotiating" data-i18n="negotiating">议价中</option>
                  <option value="awaiting_payment" data-i18n="awaiting_payment">待线下付款确认</option>
                  <option value="cancelled" data-i18n="cancelled">已取消</option>
                </select>
              </label>
              <button class="secondary-button" type="submit" data-i18n="submitOrderStatus">保存阶段</button>
              <p class="form-note" id="orderStatusNote" role="status"></p>
            </form>
            <form class="admin-form" id="followUpForm" hidden>
              <label>
                <span data-i18n="followUpStatus">跟进状态</span>
                <select id="followUpStatus">
                  <option value="unprocessed" data-i18n="unprocessed">未处理</option>
                  <option value="contacting" data-i18n="contacting">沟通中</option>
                  <option value="completed" data-i18n="completed">已完成</option>
                  <option value="cancelled" data-i18n="cancelled">已取消</option>
                </select>
              </label>
              <label>
                <span data-i18n="nextFollowUpAt">下一次跟进时间</span>
                <input id="nextFollowUpAt" type="datetime-local" />
              </label>
              <label>
                <span data-i18n="adminNote">管理员备注</span>
                <textarea id="adminNote" rows="4" maxlength="4000"></textarea>
              </label>
              <button class="primary-button" type="submit" data-i18n="saveFollowUp">保存跟进</button>
            </form>
            <div>
              <p class="form-note" data-i18n="notificationEvents">内部通知事件（仅记录，不发送外部消息）</p>
              <div class="admin-list" id="notificationEventList"></div>
            </div>
            <div>
              <div class="form-actions">
                <p class="form-note" id="emailOutboxMode" data-i18n="localEmailOutbox">本地邮件出站（假发送）</p>
                <button class="secondary-button" id="dispatchEmailOutbox" type="button" data-i18n="dispatchEmailOutbox">模拟投递</button>
              </div>
              <div class="admin-list" id="emailOutboxList"></div>
            </div>
          </div>
        </div>

        <!-- 艺术家资料 -->
        <div class="admin-panel" id="adminArtist" hidden>
          <p class="form-note legacy-notice" data-i18n="adminLegacyNotice">旧本地功能 / 本阶段未迁移：内容仍只保存在当前浏览器，不代表跨设备保存。</p>
          <form class="admin-form" id="artistForm">
            <label>
              <span data-i18n="artistNameLabel">艺术家姓名</span>
              <input id="artistNameInput" />
            </label>
            <label>
              <span data-i18n="artistBioZh">中文简介</span>
              <textarea id="artistBioZh" rows="4"></textarea>
            </label>
            <label>
              <span data-i18n="artistBioEn">英文简介</span>
              <textarea id="artistBioEn" rows="4"></textarea>
            </label>
            <label>
              <span data-i18n="portraitUpload">上传肖像</span>
              <input id="portraitUpload" type="file" accept="image/*" />
            </label>
            <div class="form-actions">
              <button class="primary-button" type="submit" data-i18n="saveArtist">保存艺术家资料</button>
            </div>
          </form>
          <div></div>
        </div>

        <!-- 人员管理 -->
        <div class="admin-panel" id="adminPeople" hidden>
          <p class="form-note legacy-notice" data-i18n="adminLegacyNotice">旧本地功能 / 本阶段未迁移：内容仍只保存在当前浏览器，不代表跨设备保存。</p>
          <form class="admin-form compact-form" id="peopleForm">
            <label>
              <span data-i18n="personName">人员姓名</span>
              <input id="personName" />
            </label>
            <label>
              <span data-i18n="personRole">角色</span>
              <select id="personRole"></select>
            </label>
            <button class="primary-button" type="submit" data-i18n="addPerson">添加人员</button>
          </form>
          <div class="admin-list" id="peopleList"></div>
        </div>

        <!-- 咨询记录 -->
        <div class="admin-panel" id="adminInquiries" hidden>
          <p class="form-note legacy-notice" data-i18n="adminLegacyNotice">旧本地功能 / 本阶段未迁移：内容仍只保存在当前浏览器，不代表跨设备保存。</p>
          <div></div>
          <div class="admin-list" id="inquiryList"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span data-i18n="footerText">游祥龙艺术工作室</span>
      <a href="index.html" data-i18n="footerAdmin">返回首页</a>
    </footer>

    <script src="common.js?v=20260823-commerce-phase3"></script>
    <script src="admin.js?v=20260823-commerce-phase3"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全部作品 · 游祥龙艺术工作室</title>
    <meta name="description" content="游祥龙油画作品全集 — 江南系列、人物叙事、民族题材。" />
    <meta property="og:title" content="全部作品 · 游祥龙艺术工作室" />
    <meta property="og:description" content="按创作脉络浏览游祥龙的油画作品，并查看尺寸、媒介、年份与收藏状态。" />
    <meta property="og:image" content="https://youxianglong.com/assets/jiangnan-2024.jpg" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://youxianglong.com/works.html" />
    <link rel="stylesheet" href="styles.css?v=20260810-redesign" />
  </head>
  <body class="public-site archive-page">
    <header class="site-header">
      <a class="brand" href="gallery.html" aria-label="游祥龙艺术工作室">
        <span class="brand-mark" aria-hidden="true">YX</span>
        <span><strong>游祥龙艺术工作室</strong><small>油画 · 风景 · 人物</small></span>
      </a>
      <nav class="main-nav" id="main-navigation" aria-label="Primary navigation">
        <a href="gallery.html#gallery">作品</a>
        <a href="gallery.html#artist">艺术家</a>
        <a href="gallery.html#contact">收藏咨询</a>
        <a href="gallery.html#contactInfo">联系方式</a>
        <a href="activities.html">活动资讯</a>
      </nav>
      <div class="header-actions">
        <a class="header-inquiry" href="gallery.html#contact">咨询收藏</a>
        <button class="ghost-button" id="langToggle" type="button">EN</button>
        <button class="menu-button" id="menuToggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="main-navigation"><span aria-hidden="true"></span></button>
      </div>
    </header>

    <main>
      <section class="section archive-hero">
        <div>
          <h1 id="archiveTitle">全部作品</h1>
          <p id="archiveIntro">按创作脉络浏览游祥龙的油画作品，并查看尺寸、媒介、年份与收藏状态。</p>
        </div>
        <span class="archive-count" id="archiveCount"></span>
      </section>
      <section class="section archive-collection">
        <div class="art-grid" id="allWorksGrid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>游祥龙艺术工作室</span>
      <a href="gallery.html">返回主站</a>
    </footer>

    <script src="common.js?v=20260825-content"></script>
    <script>
      let pageLang = state.language;

      // 从 common.js 的 state 读取所有作品
      function displayAllWorks() {
        const works = state.works.filter(w => w.status !== "private" && w.status !== "draft");
        const lang = pageLang;

        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.getElementById("langToggle").textContent = lang === "zh" ? "EN" : "中文";
        document.getElementById("archiveTitle").textContent = lang === "zh" ? "全部作品" : "All Works";
        document.getElementById("archiveIntro").textContent = lang === "zh"
          ? "按创作脉络浏览游祥龙的油画作品，并查看尺寸、媒介、年份与收藏状态。"
          : "Explore You Xianglong's paintings with medium, dimensions, year, and collection status.";
        document.getElementById("archiveCount").textContent = `${String(works.length).padStart(2, "0")} ${lang === "zh" ? "件作品" : "WORKS"}`;

        document.getElementById("allWorksGrid").innerHTML = works.map((work, index) => {
          const title = lang === "zh" ? (work.titleZh || work.titleEn) : (work.titleEn || work.titleZh);
          const desc = lang === "zh" ? (work.descriptionZh || work.descriptionEn) : (work.descriptionEn || work.descriptionZh);
          const price = work.hidePrice || !work.price ? (lang === "zh" ? "价格请咨询" : "Price on request") : work.price;
          const status = lang === "zh"
            ? ({ available: "可咨询", sold: "已收藏", draft: "草稿", private: "不公开" })[work.status] || work.status
            : ({ available: "Available", sold: "Collected" })[work.status] || work.status;
          const cat = work.category || "";
          const med = work.medium || "";
          const sz = work.size || "";
          return `
            <article class="art-card" tabindex="0">
              <a href="${workDetailHref(work.id)}" class="card-link">
                <figure><img src="${work.image}" alt="${title}" loading="lazy" decoding="async" /></figure>
                <div class="art-card-body">
                  <div class="art-card-heading"><span class="art-card-order">${String(index + 1).padStart(2, "0")}</span><span class="badge">${status}</span></div>
                  <h3>${title}</h3>
                  <div class="meta-line">${cat} ${med} · ${sz} · ${work.year}</div>
                  <div class="price-line">${price}</div>
                </div>
              </a>
            </article>`;
        }).join("");
      }

      document.getElementById("langToggle").addEventListener("click", () => {
        state.language = state.language === "zh" ? "en" : "zh";
        pageLang = state.language;
        saveState();
        displayAllWorks();
      });

      document.getElementById("menuToggle").addEventListener("click", () => {
        const menu = document.querySelector(".main-nav");
        const isOpen = menu.classList.toggle("is-open");
        document.getElementById("menuToggle").setAttribute("aria-expanded", String(isOpen));
      });

      displayAllWorks();
    </script>
  </body>
</html>

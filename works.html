<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全部作品 · 游祥龙艺术工作室</title>
    <meta name="description" content="游祥龙油画作品全集 — 江南系列、人物叙事、民族题材。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="gallery.html" aria-label="游祥龙艺术工作室">
        <span class="brand-mark">YX</span>
        <span><strong>游祥龙艺术工作室</strong><small>油画 · 风景 · 人物</small></span>
      </a>
      <nav class="main-nav">
        <a href="gallery.html#works">作品</a>
        <a href="gallery.html#artist">艺术家</a>
        <a href="gallery.html#contact">收藏咨询</a>
      </nav>
      <div class="header-actions">
        <button class="ghost-button" id="langToggle" type="button">EN</button>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="section-heading">
          <p>Collection</p>
          <h2>全部作品</h2>
        </div>
        <div class="art-grid" id="allWorksGrid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>游祥龙艺术工作室</span>
      <a href="gallery.html">返回首页</a>
    </footer>

    <script src="common.js"></script>
    <script>
      const pageLang = localStorage.getItem("splash-lang") === "en" ? "en" : "zh";

      document.getElementById("langToggle").addEventListener("click", () => {
        localStorage.setItem("splash-lang", document.getElementById("langToggle").textContent === "EN" ? "en" : "zh");
        location.reload();
      });

      const wLang = document.getElementById("langToggle").textContent === "EN" ? "en" : "zh";

      // 从 common.js 的 state 读取所有作品
      function displayAllWorks() {
        const works = state.works.filter(w => w.status !== "private" && w.status !== "draft");
        const lang = pageLang;

        document.getElementById("allWorksGrid").innerHTML = works.map(work => {
          const title = lang === "zh" ? (work.titleZh || work.titleEn) : (work.titleEn || work.titleZh);
          const desc = lang === "zh" ? (work.descriptionZh || work.descriptionEn) : (work.descriptionEn || work.descriptionZh);
          const price = work.hidePrice || !work.price ? (lang === "zh" ? "价格请咨询" : "Price on request") : work.price;
          const status = lang === "zh"
            ? ({ available: "可咨询", sold: "已收藏", draft: "草稿", private: "不公开" })[work.status] || work.status
            : ({ available: "Available", sold: "Collected" })[work.status] || work.status;
          const cat = work.category || "";
          const med = work.medium || "";
          const sz = work.size || "";
          return `
            <article class="art-card" tabindex="0">
              <a href="works/${work.id}.html" class="card-link">
                <figure><img src="${work.image}" alt="${title}" /></figure>
                <div class="art-card-body">
                  <h3>${title}<span class="badge">${status}</span></h3>
                  <div class="meta-line">${cat} ${med} · ${sz} · ${work.year}</div>
                  <div class="price-line">${price}</div>
                </div>
              </a>
            </article>`;
        }).join("");
      }

      displayAllWorks();
    </script>
  </body>
</html>
